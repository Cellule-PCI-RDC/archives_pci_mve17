name: Synchronisation Kobo
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: synchro-sitreps, cancel-in-progress: false}   # file d'attente propre à ce workflow
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # un run bloqué ne retient jamais les suivants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python sync_kobo.py
        env:
          KOBO_SERVER: ${{ vars.KOBO_SERVER }}
          KOBO_UID: ${{ vars.KOBO_UID }}
          KOBO_UID_ESS: ${{ vars.KOBO_UID_ESS }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          ACCES_CODE: ${{ secrets.ACCES_CODE }}
      - run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add summary.json data.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "Synchronisation Kobo"
          for i in 1 2 3 4 5; do   # un autre workflow a pu publier entre-temps : on récupère puis on réessaie
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep $((i*7))
          done
          echo "Publication impossible après 5 essais"; exit 1
